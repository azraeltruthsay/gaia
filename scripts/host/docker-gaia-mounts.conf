# systemd drop-in for docker.service, identical on Arch and WSL.
# Install: sudo install -Dm644 scripts/host/docker-gaia-mounts.conf \
#            /etc/systemd/system/docker.service.d/gaia-mounts.conf
#          sudo systemctl daemon-reload && sudo systemctl enable docker
#
# Both drives are `nofail` in fstab, so a boot can finish with them missing
# (on WSL, until the GAIA-WSL-Mount logon task attaches them). Without this,
# dockerd would start on the empty /mnt/dockerdata directory and build a
# fresh, empty data-root on the OS disk. With it, docker waits for both
# mounts and is skipped (not failed) when the data drive is absent; the WSL
# mount task starts it once the drives are attached.
[Unit]
RequiresMountsFor=/mnt/dockerdata /gaia
ConditionPathIsMountPoint=/mnt/dockerdata
ConditionPathIsMountPoint=/gaia
